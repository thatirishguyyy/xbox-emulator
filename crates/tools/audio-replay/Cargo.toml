[package]
name = "audio-replay"
version = "0.1.0"
edition = "2021"
description = "Replays TOMBOX_AUDIO_RECORD captures against acphal / xapu offline: output WAVs plus a stall report."
license = "GPL-3.0-or-later"

[[bin]]
name = "audio-replay"
path = "src/main.rs"

[dependencies]
acphal = { path = "../../compat/acphal" }
xapu = { path = "../../compat/xapu" }

[dev-dependencies]
opusdec = { path = "../../compat/opus" }
