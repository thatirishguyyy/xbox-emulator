[package]
name = "xdxr_d"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the Xbox console xdxr_d.dll (debug build of the DXR runtime behind xgs12_10d/xgs12_10i): XDXRCreateDevice forwarded to the console's own xdxr_d.dll, loaded on PC with the emulator xmem.dll serving its XMemAlloc/XMemFree imports."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xdxr_d"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
console-dll = { path = "../console-dll" }

[dev-dependencies]
dxcompiler_xs = { path = "../dxcompiler_xs" }
