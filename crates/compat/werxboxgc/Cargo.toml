[package]
name = "werxboxgc"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console WerXboxGc.dll (Windows Error Reporting Xbox Support): crash-store mount, report metadata, package identity and the WER transport, kept in a local store under the emulator data dir and never uploaded."
license = "GPL-3.0-or-later"

[lib]
name = "werxboxgc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
gamehost = { path = "../gamehost" }
