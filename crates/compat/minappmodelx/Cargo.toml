[package]
name = "minappmodelx"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console minappmodelx.dll, host of api-ms-win-core-psm-appnotify-l1-1-0/l1-1-1: app-state (suspend/resume) and constrained-mode change registrations delivered from the emulator PLM state machine in compat-common os_host::plm."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "minappmodelx"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
