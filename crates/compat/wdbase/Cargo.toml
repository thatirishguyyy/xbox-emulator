[package]
name = "wdbase"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console wdbase.dll (Xbox developer-tools base library): ParseArgs command-line parser, RestContext Device Portal client, UTF-8/Base64 helpers and ExecuteRemoteRun, ported from the console disassembly with the MSVC STL ABI."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "wdbase"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
