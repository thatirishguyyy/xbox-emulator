[package]
name = "d3d12_xs"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox d3d12_xs.dll — logging stubs + correct IID_ID3D12Device data export."
license = "GPL-3.0-or-later"

[lib]
name = "d3d12_xs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
xgs-kmd-emu = { path = "../xgs-kmd-emu" }
tombox-xshader = { path = "../../tombox-xshader" }

[target.'cfg(windows)'.build-dependencies]
tombox-xshader = { path = "../../tombox-xshader" }
