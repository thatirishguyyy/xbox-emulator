[package]
name = "dxcompiler_x"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox One GameCore dxcompiler_x.dll: DXC factory; forwards to a dxcompiler.dll on the search path when one exists, otherwise E_NOTIMPL like dxcompiler_xs."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "dxcompiler_x"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
