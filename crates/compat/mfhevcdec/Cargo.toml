[package]
name = "mfhevcdec"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console mfhevcdec.dll: WRL module exports and the CLSID_MSH265DecoderMFT class as a native IMFTransform that parses HEVC (VPS/SPS/PPS/slice headers, RPS, POC, DPB) and decodes on the GPU through D3D12 Video Decode (DXVA HEVC picture parameters, quantisation matrix, short slice control), producing D3D12 NV12 samples."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "mfhevcdec"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Security"] }

windows-targets = "0.52.6"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
