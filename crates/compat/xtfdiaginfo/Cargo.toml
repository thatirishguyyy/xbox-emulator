[package]
name = "xtfdiaginfo"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console xtfdiaginfo.dll (Xbox Tools Framework diagnostics extension: uptime, go-dark, logging properties, process control, debug actions, operation-request channel)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xtfdiaginfo"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
xtfcommon = { path = "../xtfcommon" }

[build-dependencies]
xtfcommon = { path = "../xtfcommon" }

[dev-dependencies]
xbtp = { path = "../xbtp" }
xtfbaseservices = { path = "../xtfbaseservices" }
