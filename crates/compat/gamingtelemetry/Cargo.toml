[package]
name = "gamingtelemetry"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for gamingtelemetry.dll: the console GTL library, writing the same TraceLogging events over local ETW."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "gamingtelemetry"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
