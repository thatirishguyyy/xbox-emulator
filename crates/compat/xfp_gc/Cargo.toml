[package]
name = "xfp_gc"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console xfp_gc.dll: the front-panel client protocol over the host XFP pipe, ported from the console bodies."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xfp_gc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
