[package]
name = "newbe_xs"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console shader backend newbe_xs.dll: every NB_ entry point forwarded to the console's own newbe_xs.dll from the title dump (read-only)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "newbe_xs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
console-image = { path = "../console-image" }
