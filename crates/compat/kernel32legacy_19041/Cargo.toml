[package]
name = "kernel32legacy_19041"
version = "0.1.0"
edition = "2021"
description = "kernel32legacy compat DLL for console OS build 10.0.19041 (Fortnite): the same code as crates/compat/kernel32legacy with the 19041 ordinal table (299 exports; BackupSeek, IsSystemResumeAutomatic, RequestWakeupLatency and SetSystemPowerState absent like the console DLL)."
license = "GPL-3.0-or-later"
build = "../kernel32legacy/build.rs"

[lib]
name = "kernel32legacy_19041"
crate-type = ["cdylib", "rlib"]
path = "../kernel32legacy/src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
