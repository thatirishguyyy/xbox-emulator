[package]
name = "gamecorecomproxy"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console gamecorecomproxy.dll (GameCore COM/WinRT proxy-stubs): the console 10.0.19041 MIDL proxy tables served through the PC rpcrt4 NdrDll* entry points."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "gamecorecomproxy"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ndr-proxy = { path = "../ndr-proxy" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
ndr-proxy = { path = "../ndr-proxy", features = ["testing"] }
