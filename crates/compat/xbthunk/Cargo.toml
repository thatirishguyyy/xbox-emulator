[package]
name = "xbthunk"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console xbthunk.dll: memory-partition handles and heaps, the redirection decision function and table, NT AVM error reporting and WinHttp hook registration, ported from the console bodies."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xbthunk"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }
