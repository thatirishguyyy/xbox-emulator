[package]
name = "xfrontpaneldisplay"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for XFrontPanelDisplay.dll: forwards the panel calls to XFP_GC as the console does, so with no panel every call returns the connect failure."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xfrontpaneldisplay"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
