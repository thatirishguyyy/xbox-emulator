[package]
name = "wldp"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console wldp.dll exports a PC wldp lacks: retail configuration, policy-setting index table, vulnerable-driver blocklist queries and dynamic-code trust, ported from the console disassembly."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "wldp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
