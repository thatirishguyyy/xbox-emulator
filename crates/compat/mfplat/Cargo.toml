[package]
name = "mfplat"
version = "0.1.0"
edition = "2021"
description = "Proxy for Xbox mfplat.dll: every PC mfplat export is a PE export forwarder to the real system mfplat (staged as mfplat_sys.dll), MFCreateDXGISurfaceBufferX forwards to MFCreateDXGISurfaceBuffer, and the console-only exports (MFResetDXGIDeviceManagerX, MFJoinIoPort, MFGetPrivateWorkqueues, MFBlockThread, MFUnblockThread, LFGetGlobalPool) follow the console mfplat.dll decompile, and MFGetPlatform returns the console mfplat.dll's own CMFPlatform object, started and shut down in lockstep with the proxy."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "mfplat"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
console-image = { path = "../console-image" }
console-sandbox = { path = "../console-sandbox" }

[dev-dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
