[package]
name = "mfh264dec"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console mfh264dec.dll: DllGetClassObject accepts only CLSID_CMSH264DecoderMFT as the console does and takes the class factory from the PC H.264 decoder MFT (System32 msmpeg2vdec.dll)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "mfh264dec"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
