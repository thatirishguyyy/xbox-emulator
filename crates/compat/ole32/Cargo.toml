[package]
name = "ole32"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console System32\\forwarders\\ole32.dll exports a PC ole32 lacks."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "ole32"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
