[package]
name = "gcxaudioext"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console GCXAudioExt.dll: the XAudio2 platform extension (heap, processor, endpoint lookup, debug configuration), ported from the console bodies."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "gcxaudioext"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
xma = { path = "../xma" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }
