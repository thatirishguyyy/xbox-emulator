[package]
name = "lsasrv"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the five console-only exports of the console lsasrv.dll (10.0.19041): the LsapAdt* audit wrappers into lsaadt and LsaIUserProfileLoaded."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "lsasrv"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
