[package]
name = "acphal"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox AcpHal.dll: APU heap, SHAPE context memory, IAcpHal object."
license = "GPL-3.0-or-later"

[lib]
name = "acphal"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
xma = { path = "../xma" }
