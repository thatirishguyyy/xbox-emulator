[package]
name = "bootshsvc"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console bootshsvc.dll (boot shell service): the svchost globals push, and ServiceMain, which runs the console's own bootshsvc.dll service code against the sandboxed console state (emulated registry/hostname, console filesystem under the emulator data dir, in-process service host)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "bootshsvc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
testing = []

[dev-dependencies]
bootshsvc = { path = ".", features = ["testing"] }

[dependencies]
compat-common = { path = "../compat-common" }
console-image = { path = "../console-image" }
console-sandbox = { path = "../console-sandbox" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }
