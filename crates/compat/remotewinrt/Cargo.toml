[package]
name = "remotewinrt"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console RemoteWinRT.dll (GameCore cross-VM WinRT helpers): ERA/SRA VM alias and SEVPipe endpoint names, suspend exemptions, WaitRemotePipe."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "remotewinrt"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
