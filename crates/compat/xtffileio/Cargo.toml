[package]
name = "xtffileio"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console xtffileio.dll (Xbox Tools Framework file I/O server extension: XbtpServerEntryPoint and the file-operation handlers over the console sandbox filesystem)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xtffileio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
xtfcommon = { path = "../xtfcommon" }
console-sandbox = { path = "../console-sandbox" }

[build-dependencies]
xtfcommon = { path = "../xtfcommon" }

[dev-dependencies]
xbtp = { path = "../xbtp" }
