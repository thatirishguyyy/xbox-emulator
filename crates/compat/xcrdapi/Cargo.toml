[package]
name = "xcrdapi"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox XCRDAPI.dll: console-layout DirectStorage (IDStorageFactoryX/QueueX/FileX/StatusArrayX) on Win32 file I/O with CPU zlib."
license = "GPL-3.0-or-later"

[lib]
name = "xcrdapi"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
miniz_oxide = "0.8"
