[package]
name = "xtfremoterun"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console xtfremoterun.dll (Xbox Tools Framework remote-run extension: the Run server operation that launches a console process with redirected console pipes, and the RemoteRunClient that drives it over an xbtp session)."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "xtfremoterun"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
xtfcommon = { path = "../xtfcommon" }
xtfmsg = { path = "../xtfmsg" }
console-sandbox = { path = "../console-sandbox" }
compat-common = { path = "../compat-common" }

[build-dependencies]
xtfcommon = { path = "../xtfcommon" }

[dev-dependencies]
xbtp = { path = "../xbtp" }
