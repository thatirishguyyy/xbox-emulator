[package]
name = "pixrt"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the Xbox console pixrt.dll: the console's lazy tooling-memory setup (xvcmgmt overflow probe, xmem tools-partition heap, working-set check and its PIX debug messages), its E_OUTOFMEMORY guard on all three exports, and the tooling-memory allocator table."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "pixrt"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
