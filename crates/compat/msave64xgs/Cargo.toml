[package]
name = "msave64xgs"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console msave64xgs.dll (Scarlett AVE video encode client loaded by the xgs12 D3D12 UMD): factory, transport and encoder objects rebuilt from the console decompile, driving the AVE extension command through the D3D12 device it is handed."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "msave64xgs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }
