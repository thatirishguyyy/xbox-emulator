[package]
name = "d3d12_x"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox One GameCore d3d12_x.dll: forwards device creation to the emulator's d3d12_xs.dll at run time, root-signature and debug entry points to host d3d12.dll, ESRAM mapping onto ordinary committed memory."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "d3d12_x"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
xgs-kmd-emu = { path = "../xgs-kmd-emu" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
