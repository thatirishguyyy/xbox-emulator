[package]
name = "tombox-archive"
version = "0.1.0"
edition = "2021"
description = "ZIP64-aware central-directory inspector and extraction safety validator. Zero dependencies."
license = "GPL-3.0-or-later"

[lib]
name = "tombox_archive"
