[package]
name = "tombox-loader"
version = "0.1.0"
edition = "2021"
description = "Compatibility image loader: maps a PE module, applies relocations, and binds imports. Windows x64."
license = "GPL-3.0-or-later"

[lib]
name = "tombox_loader"
path = "src/lib.rs"

[dependencies]
tombox-pe = { path = "../tombox-pe" }

[dev-dependencies]
# testmod (a synthetic module we build ourselves) is a separate workspace member;
# the test locates its built artifact at runtime.
