[package]
name = "tombox-probe"
version = "0.1.0"
edition = "2021"
description = "Load and resolve evidence probe for title-shipped and console-imported modules on PC."
license = "GPL-3.0-or-later"

[lib]
name = "tombox_probe"
path = "src/lib.rs"

[[bin]]
name = "tombox-probe"
path = "src/main.rs"

[dependencies]
tombox-pe = { path = "../tombox-pe" }
serde_json = "1.0.154"
iced-x86 = "1.21.0"
